<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legal Learning</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dbe1ea;--accent:#234f8f;--good:#18794e;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:21px;font-weight:850}.sub{font-size:12px;color:var(--muted)}.wrap{max-width:1180px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px}.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.card-b{padding:16px}.btn{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:750;padding:10px 14px;cursor:pointer}.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--bad);border:1px solid #f2b8b5}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.input,.area,.select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.area{min-height:90px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:750}.set{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}.set.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.qrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.choice-mini{font-size:13px;color:#475467;margin:3px 0}.pill{display:inline-block;border-radius:999px;background:#eef4ff;color:#244b7a;padding:3px 8px;font-size:11px;font-weight:800}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px}.modal-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-b{padding:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.practice-shell{max-width:850px;margin:auto}.practice-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.prompt{font-size:22px;line-height:1.45;font-weight:750;margin:14px 0}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;cursor:pointer}.letter{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#eef4ff;color:#17375f;font-weight:850;margin-right:9px}.feedback{margin-top:14px;padding:12px;border-radius:12px;display:none}.feedback.good{display:block;background:#eaf7f0;color:var(--good)}.feedback.bad{display:block;background:#fff0ef;color:var(--bad)}.progress{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.drive{position:fixed;inset:0;z-index:100;background:#0f172a;color:#fff;display:flex;flex-direction:column}.drive-top{padding:16px;border-bottom:1px solid rgba(255,255,255,.15);display:flex;justify-content:space-between}.drive-main{flex:1;display:grid;place-items:center;padding:24px}.drive-card{max-width:900px;text-align:center}.drive-prompt{font-size:clamp(24px,4vw,44px);font-weight:800;line-height:1.25}.drive-status{color:#b8c5d8;margin-bottom:14px}.drive-heard{color:#93c5fd;margin-top:18px;min-height:28px}.drive-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;background:#111c31}.drive-controls button{min-height:58px}.wide{grid-column:1/-1}.mic-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#64748b;margin-right:7px}.mic-dot.live{background:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,.16)}@media(max-width:800px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.drive-controls{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div><div class="brand">Legal Learning</div><div class="sub">Question banks + hands-free Drive Mode</div></div><button id="newSet" class="btn secondary">+ Question Set</button></div>
  <div class="wrap"><div class="grid"><aside class="card"><div class="card-h"><strong>Question Sets</strong></div><div class="card-b"><div id="sets"></div></div></aside><main class="card"><div class="card-h"><div><strong id="setTitle">Choose a question set</strong><div id="setMeta" class="sub"></div></div><div class="toolbar"><button id="practiceBtn" class="btn hidden">Practice</button><button id="driveBtn" class="btn hidden">🚗 Drive Mode</button></div></div><div class="card-b"><div id="mainBody" class="empty">Create or choose a question set.</div></div></main></div></div>
</div>

<div id="setModal" class="modal"><div class="modal-card"><div class="modal-h"><strong>New Question Set</strong><button class="btn ghost" data-close="setModal">Close</button></div><div class="modal-b"><div class="field"><label>Title</label><input id="setName" class="input"></div><div class="field"><label>Description</label><textarea id="setDesc" class="area"></textarea></div><button id="saveSet" class="btn">Create Set</button></div></div></div>
<div id="questionModal" class="modal"><div class="modal-card"><div class="modal-h"><strong>Add/Edit Question</strong><button class="btn ghost" data-close="questionModal">Close</button></div><div class="modal-b"><input id="qId" type="hidden"><div class="field"><label>Prompt</label><textarea id="qPrompt" class="area"></textarea></div><div class="two"><div class="field"><label>A</label><input id="qA" class="input"></div><div class="field"><label>B</label><input id="qB" class="input"></div><div class="field"><label>C</label><input id="qC" class="input"></div><div class="field"><label>D</label><input id="qD" class="input"></div></div><div class="field"><label>Correct choice</label><select id="qCorrect" class="select"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="field"><label>Explanation</label><textarea id="qExplain" class="area"></textarea></div><div class="field"><label>Source</label><input id="qSource" class="input"></div><button id="saveQuestion" class="btn">Save Question</button></div></div></div>
<div id="importModal" class="modal"><div class="modal-card"><div class="modal-h"><strong>Bulk Import Questions</strong><button class="btn ghost" data-close="importModal">Close</button></div><div class="modal-b"><div class="sub">Paste a JSON array with prompt, choices[4], correct_choice, and optional explanation/source.</div><textarea id="importText" class="area" style="min-height:260px"></textarea><button id="runImport" class="btn" style="margin-top:10px">Import</button><div id="importMsg" class="sub" style="margin-top:8px"></div></div></div></div>

<div id="practice" class="hidden"><div class="top"><div><div id="practiceTitle" class="brand">Practice</div><div id="practiceScore" class="sub"></div></div><div class="toolbar"><button id="practiceDrive" class="btn">🚗 Drive Mode</button><button id="exitPractice" class="btn ghost">Exit</button></div></div><div class="wrap practice-shell"><div class="practice-card"><div id="practiceCount" class="sub"></div><div class="progress"><div id="practiceBar"></div></div><div id="practicePrompt" class="prompt"></div><div id="practiceChoices" class="choices"></div><div id="practiceFeedback" class="feedback"></div><div class="toolbar" style="margin-top:14px"><button id="prevQ" class="btn ghost">Previous</button><button id="repeatQ" class="btn secondary">🔊 Read Aloud</button><button id="nextQ" class="btn ghost">Next</button></div></div></div></div>
<div id="drive" class="drive hidden"><div class="drive-top"><div><strong>Drive Mode</strong><div id="driveCount" class="sub" style="color:#b8c5d8"></div></div><button id="stopDrive" class="btn ghost">Stop</button></div><div class="drive-main"><div class="drive-card"><div id="driveStatus" class="drive-status"><span id="micDot" class="mic-dot"></span>Ready</div><div id="drivePrompt" class="drive-prompt"></div><div id="driveHeard" class="drive-heard"></div></div></div><div class="drive-controls"><button id="driveRepeat" class="btn secondary">Repeat</button><button id="drivePrev" class="btn secondary">Previous</button><button id="driveNext" class="btn secondary">Next</button><button id="driveListen" class="btn wide">🎤 Listen</button><button id="driveExit" class="btn ghost wide">Exit Drive Mode</button></div></div>
<script>
const SUPABASE_URL='https://sfxysyelxfoagyuloxsc.supabase.co';const SUPABASE_KEY='sb_publishable_h4RYAMoVZXfuRvdNMaE1RQ_FcPmqrpU';const OWNER='11111111-1111-1111-1111-111111111111';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const $=s=>document.querySelector(s),letters=['A','B','C','D'];let sets=[],activeSet=null,questions=[],practiceIndex=0,correctCount=0,answered=new Map(),driveOn=false,recognition=null,isSpeaking=false;
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function show(id,on=true){$(id).classList.toggle('hidden',!on)}function modal(id,on=true){$('#'+id).classList.toggle('open',on)}document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)modal(c.dataset.close,false)});
async function loadSets(){const {data,error}=await sb.from('question_sets').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);sets=data||[];renderSets();if(activeSet)await selectSet(activeSet.id)}function renderSets(){const el=$('#sets');el.innerHTML=sets.length?sets.map(s=>`<div class="set ${activeSet?.id===s.id?'active':''}" data-set="${s.id}"><strong>${esc(s.title)}</strong><div class="sub">${esc(s.description||'')}</div></div>`).join(''):'<div class="empty">No question sets yet.</div>';el.querySelectorAll('[data-set]').forEach(x=>x.onclick=()=>selectSet(x.dataset.set))}async function selectSet(id){activeSet=sets.find(s=>s.id===id);if(!activeSet)return;renderSets();$('#setTitle').textContent=activeSet.title;$('#setMeta').textContent=activeSet.description||'';show('#practiceBtn');show('#driveBtn');await loadQuestions()}async function loadQuestions(){const {data,error}=await sb.from('questions').select('*').eq('set_id',activeSet.id).order('sort_order').order('created_at');if(error)return alert(error.message);questions=data||[];renderQuestions()}function renderQuestions(){const body=$('#mainBody');body.className='';body.innerHTML=`<div class="toolbar" style="margin-bottom:14px"><button id="addQ" class="btn">+ Add Question</button><button id="importQ" class="btn secondary">Bulk Import</button><span class="pill">${questions.length} questions</span></div>${questions.length?questions.map((q,i)=>`<div class="qrow"><strong>${i+1}. ${esc(q.prompt)}</strong>${(q.choices||[]).map((c,j)=>`<div class="choice-mini">${letters[j]}. ${esc(c)}</div>`).join('')}<div class="toolbar" style="margin-top:8px"><span class="pill">Correct: ${q.correct_choice}</span><button class="btn ghost" data-edit="${q.id}">Edit</button><button class="btn danger" data-del="${q.id}">Delete</button></div></div>`).join(''):'<div class="empty">Add questions or bulk-import a question bank.</div>';$('#addQ').onclick=()=>openQuestion();$('#importQ').onclick=()=>modal('importModal');body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openQuestion(questions.find(q=>q.id===b.dataset.edit)));body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteQuestion(b.dataset.del))}
$('#newSet').onclick=()=>modal('setModal');$('#saveSet').onclick=async()=>{const title=$('#setName').value.trim();if(!title)return alert('Enter a title.');const {data,error}=await sb.from('question_sets').insert({user_id:OWNER,title,description:$('#setDesc').value.trim()}).select().single();if(error)return alert(error.message);activeSet=data;modal('setModal',false);await loadSets()};function openQuestion(q=null){$('#qId').value=q?.id||'';$('#qPrompt').value=q?.prompt||'';$('#qA').value=q?.choices?.[0]||'';$('#qB').value=q?.choices?.[1]||'';$('#qC').value=q?.choices?.[2]||'';$('#qD').value=q?.choices?.[3]||'';$('#qCorrect').value=q?.correct_choice||'A';$('#qExplain').value=q?.explanation||'';$('#qSource').value=q?.source||'';modal('questionModal')}$('#saveQuestion').onclick=async()=>{const id=$('#qId').value,p={set_id:activeSet.id,user_id:OWNER,prompt:$('#qPrompt').value.trim(),choices:[$('#qA').value.trim(),$('#qB').value.trim(),$('#qC').value.trim(),$('#qD').value.trim()],correct_choice:$('#qCorrect').value,explanation:$('#qExplain').value.trim(),source:$('#qSource').value.trim(),sort_order:id?questions.findIndex(q=>q.id===id)+1:questions.length+1};if(!p.prompt||p.choices.some(x=>!x))return alert('Enter the prompt and all four choices.');const r=id?await sb.from('questions').update(p).eq('id',id):await sb.from('questions').insert(p);if(r.error)return alert(r.error.message);modal('questionModal',false);await loadQuestions()};async function deleteQuestion(id){if(!confirm('Delete this question?'))return;const {error}=await sb.from('questions').delete().eq('id',id);if(error)return alert(error.message);await loadQuestions()}
$('#runImport').onclick=async()=>{try{const arr=JSON.parse($('#importText').value);const rows=arr.map((x,i)=>({set_id:activeSet.id,user_id:OWNER,prompt:String(x.prompt),choices:x.choices.map(String),correct_choice:String(x.correct_choice).toUpperCase(),explanation:String(x.explanation||''),source:String(x.source||''),sort_order:questions.length+i+1}));const {error}=await sb.from('questions').insert(rows);if(error)throw error;$('#importMsg').textContent=`Imported ${rows.length} questions.`;modal('importModal',false);await loadQuestions()}catch(e){$('#importMsg').textContent=e.message}};
$('#practiceBtn').onclick=startPractice;$('#driveBtn').onclick=()=>{startPractice();setTimeout(startDrive,50)};$('#practiceDrive').onclick=startDrive;$('#exitPractice').onclick=exitPractice;function startPractice(){if(!questions.length)return alert('Add questions first.');practiceIndex=0;correctCount=0;answered=new Map();show('#app',false);show('#practice',true);$('#practiceTitle').textContent=activeSet.title;renderPractice()}function exitPractice(){stopDrive();speechSynthesis.cancel();show('#practice',false);show('#app',true)}function renderPractice(){const q=questions[practiceIndex];$('#practiceCount').textContent=`Question ${practiceIndex+1} of ${questions.length}`;$('#practiceBar').style.width=((practiceIndex+1)/questions.length*100)+'%';$('#practicePrompt').textContent=q.prompt;$('#practiceChoices').innerHTML=q.choices.map((c,i)=>`<button class="choice" data-choice="${letters[i]}"><span class="letter">${letters[i]}</span>${esc(c)}</button>`).join('');$('#practiceChoices').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.dataset.choice,'tap'));$('#practiceScore').textContent=`Score ${correctCount}/${answered.size}`;const fb=$('#practiceFeedback');fb.className='feedback';fb.textContent='';if(driveOn)renderDriveQuestion()}async function answer(choice,mode='tap',spokenText=''){const q=questions[practiceIndex],ok=choice===q.correct_choice;if(!answered.has(q.id)){answered.set(q.id,{choice,ok});if(ok)correctCount++;await sb.from('attempts').insert({user_id:OWNER,question_id:q.id,answer_choice:choice,answer_text:spokenText||choice,is_correct:ok,mode})}const fb=$('#practiceFeedback');fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?`Correct. ${q.explanation||''}`:`Incorrect. Correct answer: ${q.correct_choice}. ${q.explanation||''}`;$('#practiceScore').textContent=`Score ${correctCount}/${answered.size}`;if(driveOn){speak(ok?'Correct.':`Incorrect. The correct answer is ${q.correct_choice}, ${choiceText(q,q.correct_choice)}.`,()=>setTimeout(()=>{if(practiceIndex<questions.length-1){practiceIndex++;renderPractice();readCurrent()}},600))}}function move(d){practiceIndex=Math.max(0,Math.min(questions.length-1,practiceIndex+d));renderPractice();if(driveOn)readCurrent()}$('#prevQ').onclick=()=>move(-1);$('#nextQ').onclick=()=>move(1);$('#repeatQ').onclick=readCurrent;
function choiceText(q,l){return q.choices[letters.indexOf(l)]||''}function speechText(q){return `Question ${practiceIndex+1} of ${questions.length}. ${q.prompt}. A. ${choiceText(q,'A')}. B. ${choiceText(q,'B')}. C. ${choiceText(q,'C')}. D. ${choiceText(q,'D')}. Say A, B, C, or D, or say the answer itself.`}function speak(t,end){try{recognition&&recognition.abort()}catch(e){}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;isSpeaking=true;u.onend=()=>{isSpeaking=false;end&&end()};speechSynthesis.speak(u)}function readCurrent(){speak(speechText(questions[practiceIndex]),()=>{if(driveOn)startListening()})}
function startDrive(){driveOn=true;show('#drive',true);renderDriveQuestion();setupRecognition();setTimeout(readCurrent,150)}function stopDrive(){driveOn=false;show('#drive',false);speechSynthesis.cancel();try{recognition&&recognition.abort()}catch(e){}}function renderDriveQuestion(){const q=questions[practiceIndex];$('#driveCount').textContent=`Question ${practiceIndex+1} of ${questions.length}`;$('#drivePrompt').textContent=q.prompt;$('#driveHeard').textContent=''}function setupRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#driveStatus').textContent='Voice recognition is not supported in this browser.';return}recognition=new SR();recognition.lang='en-US';recognition.maxAlternatives=5;recognition.onstart=()=>$('#micDot')?.classList.add('live');recognition.onend=()=>$('#micDot')?.classList.remove('live');recognition.onresult=e=>{const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);$('#driveHeard').textContent='Heard: “'+alts[0]+'”';handleVoice(alts)}}function startListening(){if(!driveOn||!recognition||isSpeaking)return;try{recognition.start()}catch(e){}}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function parseLetter(t){const n=norm(t),map={a:'A',ay:'A',b:'B',bee:'B',c:'C',see:'C',sea:'C',d:'D',dee:'D'};if(map[n])return map[n];const m=n.match(/(?:answer|choice|option|letter)\s+([abcd])/);return m?m[1].toUpperCase():null}function similarity(a,b){const A=new Set(norm(a).split(' ').filter(Boolean)),B=new Set(norm(b).split(' ').filter(Boolean));let hit=0;A.forEach(x=>B.has(x)&&hit++);return hit/Math.max(A.size||1,B.size||1)}function matchText(t,q){let best=null,score=0;q.choices.forEach((c,i)=>{const s=similarity(t,c);if(s>score){score=s;best=letters[i]}});return score>=.55?best:null}function handleVoice(alts){const n=norm(alts[0]);if(/\b(stop|exit|quit)\b/.test(n))return stopDrive();if(/\b(repeat|again)\b/.test(n))return readCurrent();if(/\b(previous|back)\b/.test(n))return move(-1);if(/\b(next|skip)\b/.test(n))return move(1);let choice=null;for(const t of alts){choice=parseLetter(t)||matchText(t,questions[practiceIndex]);if(choice)break}if(choice)return answer(choice,'voice',alts[0]);speak('I did not catch an answer. Say A, B, C, or D.',()=>setTimeout(startListening,250))}$('#stopDrive').onclick=stopDrive;$('#driveExit').onclick=stopDrive;$('#driveRepeat').onclick=readCurrent;$('#drivePrev').onclick=()=>move(-1);$('#driveNext').onclick=()=>move(1);$('#driveListen').onclick=startListening;loadSets();
</script>
</body>
</html>
